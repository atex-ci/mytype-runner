name: setup-new-instance

# Installs a new MyType instance: the code of GIT_BRANCH (shared/build/boot.sh) creates the instance from the
# environment file the installer built.
#
# ENV_FILE_CONTENT is an envelope (v1.…), encrypted by the installer to a public key: a dispatch input is readable by
# whoever can read the run, so the file, which holds the passwords and keys of the instance, never travels in it in
# clear, and a value in clear is refused. The first steps are code of THIS repository (scripts/open-env-file.mjs), run
# before any code of the branch: they open the envelope, mask every secret of the file and leave what the old flow
# received (the base64 of the file) in the job's temp folder for the BUILD step. The envelope is bound to
# `mytype/<ENV_FILE_NAME>`, so one made for another instance opens nowhere else.
#
# What this does not hide is the file from the branch: boot.sh and the install scripts of the branch consume the
# values (they store them in AWS Secrets Manager, create the database and set the Convox app), and the job already
# holds the credentials of Convox and AWS. The private key is referenced by one step but stays in the memory of the
# runner process for the whole job, like every secret of the job: install-product.yml keeps it from branch code by
# giving the key to a job of its own, which is possible there because that job performs the side effect that
# consumes the values; here the branch performs it.
on:  
  workflow_dispatch:
    inputs:
      GIT_BRANCH:
        description: 'branch to clone'     
        required: true
        default: 'main'
      ACTOR:
        description: 'actor'     
        required: true
        default: 'atex-ci'
      ENV_FILE_NAME:
        type: string
        required: true
        description: environment file name
      ENV_FILE_CONTENT:
        type: string
        required: true
        description: 'environment file: the envelope (v1.…) of its base64, encrypted to the install public key'

run-name: >
  setup-new-instance ·
  for ${{ github.event.inputs.ENV_FILE_NAME }} ·
  ${{ github.event.inputs.GIT_BRANCH != 'main'
      && '[sticky] '
      || '' }}${{ github.event.inputs.GIT_BRANCH }}

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      LOGTAIL_AUTH_TOKEN: ${{ secrets.LOGTAIL_AUTH_TOKEN }}
      CONVOX_TOKEN: ${{ secrets.CONVOX_TOKEN }}
      PEM_DEV_EC2_AURORA_BROWSER: ${{ secrets.PEM_DEV_EC2_AURORA_BROWSER }}
      PEM_STAGING_EC2_AURORA_BROWSER: ${{ secrets.PEM_STAGING_EC2_AURORA_BROWSER }}
      AURORA_DEV_ADMIN_PASSWORD: ${{ secrets.AURORA_DEV_ADMIN_PASSWORD }}
      AURORA_STAGING_ADMIN_PASSWORD: ${{ secrets.AURORA_STAGING_ADMIN_PASSWORD }}
      GIT_BRANCH: ${{ github.event.inputs.GIT_BRANCH }}
      ENV_FILE_NAME: ${{ github.event.inputs.ENV_FILE_NAME }}
      ACTOR: ${{ github.event.inputs.ACTOR }}
      DEFAULT_AWS_ACCESS_KEY_ID: "${{ secrets.DEFAULT_AWS_ACCESS_KEY_ID }}"
      DEFAULT_AWS_SECRET_ACCESS_KEY: "${{ secrets.DEFAULT_AWS_SECRET_ACCESS_KEY }}"
      DEFAULT_AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
      DEFAULT_AYRSHARE_PRIVATE_KEY: ${{ secrets.AYRSHARE_PRIVATE_KEY }}
      GH_REPO_OWNER: ${{ github.repository_owner }} 
      GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
      
    steps:
      # This repository at the commit the run was dispatched on: the only code that touches the envelope, and it
      # runs before any code of the branch. The action is pinned to a commit, as in install-product.yml.
      - name: checkout of this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Opens the envelope, masks every secret, and leaves the base64 of the file where only this user reads it.
      - name: Open the environment file
        env:
          ENVELOPE: ${{ github.event.inputs.ENV_FILE_CONTENT }}
          INSTALL_SECRETS_PRIVATE_KEY: ${{ secrets.INSTALL_SECRETS_PRIVATE_KEY }}
          OPENED_FILE: ${{ runner.temp }}/env-file-content
        run: node scripts/open-env-file.mjs

      # The branch is cloned into the empty workspace, as it always was.
      - name: Clear the workspace
        run: find . -mindepth 1 -delete

      - name: checkout
        run: |
          pwd
          echo "GIT_BRANCH is $GIT_BRANCH"
          git config --global http.sslverify false
          git clone --branch "$GIT_BRANCH" "https://${{ github.repository_owner }}:${{ secrets.GH_PASSWORD }}@github.com/atex-products/mytype.git" .
          ls -la

      # .nvmrc is the source of truth for the Node version, floored at the oldest Node
      # LTS we are willing to build on. Branches predating the Node 24 standardisation
      # still declare v20, whose last release was 2026-03-24 and which no longer gets
      # security patches - honouring that literally would DOWNGRADE them from the v22
      # they build on today. This floor is policy, not a stopgap: we never build on an
      # end-of-life Node. Raise MIN_NODE when the floor itself reaches EOL (22: ~2027-04).
      - name: Resolve Node version
        id: node-version
        run: |
          MIN_NODE=22
          want=$(tr -dc '0-9.' < .nvmrc 2>/dev/null || true)
          major=${want%%.*}
          case "$major" in
            ''|*[!0-9]*) resolved=$MIN_NODE ;;
            *) if [ "$major" -lt "$MIN_NODE" ]; then resolved=$MIN_NODE; else resolved=$want; fi ;;
          esac
          echo "resolved Node $resolved (.nvmrc requested '${want:-none}', floor $MIN_NODE)"
          echo "version=$resolved" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        name: Install node
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          version: 11
          run_install: false
  
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: Restore cached pnpm dependencies
        id: cache-dependencies-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          
      - name: Install zx globally and add to PATH
        run: |
          # pnpm 11 keeps global binaries in $PNPM_HOME/bin and refuses to install there
          # unless that directory is already on PATH, so it is created and exported first.
          # `pnpm config get global-bin-dir` cannot be used for this any more: it prints
          # "undefined" on pnpm 11.
          PNPM_GLOBAL_BIN="${PNPM_HOME:-$HOME/.local/share/pnpm}/bin"
          mkdir -p "$PNPM_GLOBAL_BIN"
          export PATH="$PNPM_GLOBAL_BIN:$PATH"
          echo "$PNPM_GLOBAL_BIN" >> $GITHUB_PATH

          # Install zx globally if not already installed
          if ! command -v zx &> /dev/null; then
            echo "Installing zx globally..."
            pnpm install -g zx@^8.8.5
          fi
          echo "zx is available at: $(which zx)"
          
      - name: Install dependencies
        run: pnpm install

      - name: Get Current Job Log URL
        id: jobs
        run: |
          JOBS_URL="https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs"
          JOB_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GH_PASSWORD }}" "$JOBS_URL" | jq -r '.jobs[] | select(.name == "${{ github.job }}") | .html_url')
          echo "html_url=$JOB_URL" >> $GITHUB_OUTPUT
          
      - name: BUILD
        env:
          JOB_URL: ${{ steps.jobs.outputs.html_url }}
          SALT: ${{ secrets.SALT }}
          OPENED_FILE: ${{ runner.temp }}/env-file-content
        run: |
          # What the old flow read from the event: the base64 of the file, opened and masked by the first steps
          ENV_FILE_CONTENT=$(cat "$OPENED_FILE")
          rm -f "$OPENED_FILE"
          export ENV_FILE_CONTENT
          ./shared/build/boot.sh "$GIT_BRANCH" "$JOB_URL" "$ENV_FILE_NAME" "$SALT" install
