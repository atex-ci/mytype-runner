name: setup-new-instance

on:  
  workflow_dispatch:
    inputs:
      GIT_BRANCH:
        description: 'branch to clone'     
        required: true
        default: 'main'
      ACTOR:
        description: 'actor'     
        required: true
        default: 'atex-ci'
      ENV_FILE_NAME:
        type: string
        required: true
        description: environment file name
      ENV_FILE_CONTENT:
        type: string
        required: true
        description: environment file content (JSON stringified)

run-name: >
  setup-new-instance ·
  for ${{ github.event.inputs.ENV_FILE_NAME }} ·
  ${{ github.event.inputs.GIT_BRANCH != 'main'
      && '[sticky] '
      || '' }}${{ github.event.inputs.GIT_BRANCH }}

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      LOGTAIL_AUTH_TOKEN: ${{ secrets.LOGTAIL_AUTH_TOKEN }}
      CONVOX_TOKEN: ${{ secrets.CONVOX_TOKEN }}
      PEM_DEV_EC2_AURORA_BROWSER: ${{ secrets.PEM_DEV_EC2_AURORA_BROWSER }}
      PEM_STAGING_EC2_AURORA_BROWSER: ${{ secrets.PEM_STAGING_EC2_AURORA_BROWSER }}
      AURORA_DEV_ADMIN_PASSWORD: ${{ secrets.AURORA_DEV_ADMIN_PASSWORD }}
      AURORA_STAGING_ADMIN_PASSWORD: ${{ secrets.AURORA_STAGING_ADMIN_PASSWORD }}
      ENV_FILE_NAME: ${{ github.event.inputs.ENV_FILE_NAME }}
      ENV_FILE_CONTENT: ${{ github.event.inputs.ENV_FILE_CONTENT }}
      ACTOR: ${{ github.event.inputs.ACTOR }}
      DEFAULT_AWS_ACCESS_KEY_ID: "${{ secrets.DEFAULT_AWS_ACCESS_KEY_ID }}"
      DEFAULT_AWS_SECRET_ACCESS_KEY: "${{ secrets.DEFAULT_AWS_SECRET_ACCESS_KEY }}"
      GH_REPO_OWNER: ${{ github.repository_owner }} 
      GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
      
    steps:
      - name: checkout
        run: |
          pwd
          echo "GIT_BRANCH is ${{ github.event.inputs.GIT_BRANCH}}"
          git config --global http.sslverify false
          git clone --branch "${{ github.event.inputs.GIT_BRANCH}}" "https://${{ github.repository_owner }}:${{ secrets.GH_PASSWORD }}@github.com/atex-products/mytype.git" .
          ls -la

      # .nvmrc is the source of truth for the Node version, floored at the oldest Node
      # LTS we are willing to build on. Branches predating the Node 24 standardisation
      # still declare v20, whose last release was 2026-03-24 and which no longer gets
      # security patches - honouring that literally would DOWNGRADE them from the v22
      # they build on today. This floor is policy, not a stopgap: we never build on an
      # end-of-life Node. Raise MIN_NODE when the floor itself reaches EOL (22: ~2027-04).
      - name: Resolve Node version
        id: node-version
        run: |
          MIN_NODE=22
          want=$(tr -dc '0-9.' < .nvmrc 2>/dev/null || true)
          major=${want%%.*}
          case "$major" in
            ''|*[!0-9]*) resolved=$MIN_NODE ;;
            *) if [ "$major" -lt "$MIN_NODE" ]; then resolved=$MIN_NODE; else resolved=$want; fi ;;
          esac
          echo "resolved Node $resolved (.nvmrc requested '${want:-none}', floor $MIN_NODE)"
          echo "version=$resolved" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        name: Install node
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          version: 11
          run_install: false
  
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: Restore cached pnpm dependencies
        id: cache-dependencies-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          
      - name: Install zx globally and add to PATH
        run: |
          # pnpm 11 keeps global binaries in $PNPM_HOME/bin and refuses to install there
          # unless that directory is already on PATH, so it is created and exported first.
          # `pnpm config get global-bin-dir` cannot be used for this any more: it prints
          # "undefined" on pnpm 11.
          PNPM_GLOBAL_BIN="${PNPM_HOME:-$HOME/.local/share/pnpm}/bin"
          mkdir -p "$PNPM_GLOBAL_BIN"
          export PATH="$PNPM_GLOBAL_BIN:$PATH"
          echo "$PNPM_GLOBAL_BIN" >> $GITHUB_PATH

          # Install zx globally if not already installed
          if ! command -v zx &> /dev/null; then
            echo "Installing zx globally..."
            pnpm install -g zx@^8.8.5
          fi
          echo "zx is available at: $(which zx)"
          
      - name: Install dependencies
        run: pnpm install

      - name: Get Current Job Log URL
        id: jobs
        run: |
          JOBS_URL="https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs"
          JOB_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GH_PASSWORD }}" "$JOBS_URL" | jq -r '.jobs[] | select(.name == "${{ github.job }}") | .html_url')
          echo "html_url=$JOB_URL" >> $GITHUB_OUTPUT
          
      - name: BUILD
        run: |            
          ./shared/build/boot.sh "${{ github.event.inputs.GIT_BRANCH }}" "${{ steps.jobs.outputs.html_url }}" "${{ github.event.inputs.ENV_FILE_NAME }}" "${{ secrets.SALT }}" install
