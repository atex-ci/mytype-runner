name: route

# Every push to atex-products/mytype lands here (its on-push.yml). The router knows no product: it starts
# the push's test suite once (lint and tests of every project, Nx cached: product agnostic), checks once that
# the commit message names its Jira ticket, and dispatches the pipeline workflow named after every product
# the push changes (<product>.yml), handing it the test suite's run id: MyType's pipeline gates on it, the
# others gate on their own projects and only use it to know the run is a push (PMC-6769). A product whose dispatch
# fails does not stop the others; the run fails at the end.
# The products come from the Nx graph (shared/build/scripts/products/affected-products.mjs in mytype).
on:
  workflow_dispatch:
    inputs:
      GIT_BRANCH:
        description: 'pushed branch'
        required: true
      GIT_SHA:
        description: 'pushed commit (default: the tip of the branch)'
        required: false
        default: ''
      BASE_SHA:
        description: 'commit before the push (github.event.before): what a push to main is compared with'
        required: false
        default: ''

run-name: >
  route · ${{ inputs.GIT_BRANCH }}

# A newer push to a branch replaces the routing of its older one; a main push is never cancelled.
concurrency:
  group: route-${{ inputs.GIT_BRANCH == 'main' && github.run_id || inputs.GIT_BRANCH }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    env:
      GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ vars.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
    steps:
      # Same checkout as manual-build.yml: the pushed commit, even when its branch is already gone.
      - name: checkout
        env:
          GIT_BRANCH: ${{ inputs.GIT_BRANCH }}
          GIT_SHA: ${{ inputs.GIT_SHA }}
          REPO_URL: https://${{ github.repository_owner }}:${{ secrets.GH_PASSWORD }}@github.com/atex-products/mytype.git
        run: |
          git config --global http.sslverify false
          if [ -z "$GIT_SHA" ]; then
            git clone --branch "$GIT_BRANCH" "$REPO_URL" .
          else
            git clone "$REPO_URL" .
            git fetch origin "$GIT_SHA"
            git checkout -B "$GIT_BRANCH" "$GIT_SHA"
          fi

      - name: Start the test suite
        id: test-suite
        env:
          GIT_BRANCH: ${{ inputs.GIT_BRANCH }}
        run: |
          bash ./shared/build/scripts/test-suite/dispatch.sh
          echo "run-id=$(cat test_suite_run_id.txt)" >> "$GITHUB_OUTPUT"
          rm test_suite_run_id.txt

      # Same Node policy as manual-build.yml: .nvmrc, floored at the oldest LTS we build on.
      - name: Resolve Node version
        id: node-version
        run: |
          MIN_NODE=22
          want=$(tr -dc '0-9.' < .nvmrc 2>/dev/null || true)
          major=${want%%.*}
          case "$major" in
            ''|*[!0-9]*) resolved=$MIN_NODE ;;
            *) if [ "$major" -lt "$MIN_NODE" ]; then resolved=$MIN_NODE; else resolved=$want; fi ;;
          esac
          echo "version=$resolved" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore cached pnpm dependencies
        uses: actions/cache/restore@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      # The commit message starts with a ticket of the Jira filter JIRA_FILTER_ID in all.env (shared/build/tools/jira).
      # A message without one fails the push before any product pipeline runs.
      - name: Check the commit message
        id: jira
        env:
          JIRA_AUTH_TOKEN: ${{ secrets.JIRA_AUTH_TOKEN }}
        run: |
          source shared/build/env/all.env
          pnpm --filter build build
          node shared/build/dist/jira

      # A branch that predates the product tags (PMC-6633) has no script: it builds as before, MyType only.
      - name: Affected products
        id: products
        env:
          GIT_BRANCH: ${{ inputs.GIT_BRANCH }}
          BASE_SHA: ${{ inputs.BASE_SHA }}
        run: |
          script=shared/build/scripts/products/affected-products.mjs
          if [ -f "$script" ]; then
            list=$(node "$script")
          else
            echo "::notice::$script is not on this branch: it builds as before its product tags"
            list='["mytype"]'
          fi
          echo "products: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      # Every product is dispatched even when another one fails; the failures are collected and fail the run at
      # the end. The pipeline workflows are listed once: a product without one is a warning (it has no pipeline
      # yet), while any other answer of GitHub, a 404 of the dispatch included, is a failure.
      # A product with an e2e suite (<product>-e2e.yml, contributor-e2e.yml) gets it dispatched beside its pipeline,
      # which it does not gate; a failed dispatch of it is collected like the pipeline's.
      - name: Dispatch the product pipelines
        env:
          PRODUCTS: ${{ steps.products.outputs.list }}
          GIT_BRANCH: ${{ inputs.GIT_BRANCH }}
          TEST_SUITE_RUN_ID: ${{ steps.test-suite.outputs.run-id }}
          API: https://api.github.com/repos/${{ github.repository }}/actions/workflows
        run: |
          sha=$(git rev-parse HEAD)
          products=$(echo "$PRODUCTS" | jq -r '.[]')
          if [ -z "$products" ]; then
            echo "::notice::the push changes no product: tests only"
            exit 0
          fi
          curl -sS --fail-with-body -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_PASSWORD" \
            "$API?per_page=100" -o workflows.json
          failed=""
          for product in $products; do
            if ! jq -e --arg path ".github/workflows/$product.yml" '.workflows[] | select(.path == $path)' workflows.json > /dev/null; then
              echo "::warning::product $product has no pipeline yet ($product.yml): not built"
              continue
            fi
            payload=$(jq -cn --arg branch "$GIT_BRANCH" --arg sha "$sha" --arg tests "$TEST_SUITE_RUN_ID" \
              '{ref: "main", inputs: {GIT_BRANCH: $branch, GIT_SHA: $sha, TEST_SUITE_RUN_ID: $tests}}')
            code=$(curl -s -o response.json -w '%{http_code}' -X POST \
              -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_PASSWORD" \
              "$API/$product.yml/dispatches" -d "$payload")
            case "$code" in
              204|200) echo "::notice::$product pipeline dispatched" ;;
              *) echo "::error::dispatch of $product.yml answered $code: $(cat response.json)"; failed="$failed $product" ;;
            esac
            if ! jq -e --arg path ".github/workflows/$product-e2e.yml" '.workflows[] | select(.path == $path)' workflows.json > /dev/null; then
              continue
            fi
            payload=$(jq -cn --arg branch "$GIT_BRANCH" --arg sha "$sha" \
              '{ref: "main", inputs: {GIT_BRANCH: $branch, GIT_SHA: $sha}}')
            code=$(curl -s -o response.json -w '%{http_code}' -X POST \
              -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_PASSWORD" \
              "$API/$product-e2e.yml/dispatches" -d "$payload")
            case "$code" in
              204|200) echo "::notice::$product e2e suite dispatched" ;;
              *) echo "::error::dispatch of $product-e2e.yml answered $code: $(cat response.json)"; failed="$failed $product-e2e" ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "::error::not dispatched:$failed"
            exit 1
          fi

      # A rejected commit message leaves the suite started above holding a runner for a push that goes no
      # further. Only that failure cancels it: after any other one (a product that did not dispatch) the
      # pipelines of the other products may be awaiting it.
      - name: Stop the test suite of a rejected commit message
        if: failure() && steps.jira.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GH_PASSWORD }}
          RUN_ID: ${{ steps.test-suite.outputs.run-id }}
        run: gh run cancel "$RUN_ID" -R "$GITHUB_REPOSITORY" || true
