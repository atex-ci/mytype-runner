name: install-product

# Installs a new environment of a product on a Convox rack (apps/<PRODUCT>/ of atex-products/mytype), for the
# installer of the deploy tool, in two jobs:
#   secrets  the Convox app on the rack: created if the rack does not list it, marked as this product's, its variables
#            set from stdin. Runs code of THIS repository only (scripts/prepare-app.mjs) and nothing of the branch.
#   install  the code of the branch being built (shared/build/scripts/products/install.mjs of GIT_BRANCH): adds
#            apps/<PRODUCT>/deploy/<ENVIRONMENT>.env (ENV_FILE_CONTENT, base64, not secret), deploys once through
#            deploy.mjs, writes the app's URL into the file and commits that file to GIT_BRANCH. It is told the NAMES of
#            the variables that were set, never a value.
# A failed run changed nothing in the repository and can be run again: an app that is the install's own is reused.
#
# VARIABLES is an envelope (v1.…) of the KEY=VALUE lines, encrypted by the installer to a public key: a dispatch input
# is readable by whoever can read the run, so it never holds a secret in clear, and a value in clear is refused.
#
# THE RULE (for setup-new-instance.yml too): the job that holds the key performs the side effect that consumes the
# secrets, and branch code never receives the values. A secret that any step of a job references stays in the memory
# of the runner process for the whole job, where code of the branch (install scripts have sudo) can read it: so
# INSTALL_SECRETS_PRIVATE_KEY is referenced by the `secrets` job alone, which never checks out or installs anything of
# the branch.
on:
  workflow_dispatch:
    inputs:
      GIT_BRANCH:
        description: 'branch the environment file is committed to'
        required: true
        default: 'main'
      PRODUCT:
        description: 'product, as in apps/<product> (contributor)'
        required: true
      ENVIRONMENT:
        description: 'name of the new environment, also the name of its Convox app'
        required: true
      ENV_FILE_CONTENT:
        description: 'environment file, base64 (not secret)'
        required: true
      VARIABLES:
        description: 'runtime variables of the app: the envelope (v1.…) of KEY=VALUE lines, encrypted to the install public key'
        required: true

run-name: install · ${{ inputs.PRODUCT }} · ${{ inputs.ENVIRONMENT }} · ${{ inputs.GIT_BRANCH }}

# Two installs of one environment never run together; none is cancelled once started.
concurrency:
  group: install-${{ inputs.PRODUCT }}-${{ inputs.ENVIRONMENT }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    outputs:
      variables: ${{ steps.prepare.outputs.variables }}
    steps:
      # This repository at the commit the run was dispatched on: the only code this job runs.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # As contributor.yml: the latest release.
      - name: Convox CLI
        run: |
          curl -fsSL --retry 5 --retry-delay 5 -o convox https://github.com/convox/convox/releases/latest/download/convox-linux
          sudo install -m 755 convox /usr/local/bin/convox
          rm convox
          convox version

      # Checks the inputs, asks GitHub (with the credential of this job) about the branch and the files it needs,
      # opens the envelope, masks every value, then creates the app and sets its variables. The inputs reach the
      # script through the environment, never through the shell line. Its output is the names of the variables set.
      - name: Prepare the app on the rack
        id: prepare
        env:
          ENVELOPE: ${{ inputs.VARIABLES }}
          INSTALL_SECRETS_PRIVATE_KEY: ${{ secrets.INSTALL_SECRETS_PRIVATE_KEY }}
          CONVOX_TOKEN: ${{ secrets.CONVOX_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
          GIT_BRANCH: ${{ inputs.GIT_BRANCH }}
          PRODUCT: ${{ inputs.PRODUCT }}
          ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
          ENV_FILE_CONTENT: ${{ inputs.ENV_FILE_CONTENT }}
        run: node scripts/prepare-app.mjs

  install:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      # Same checkout as setup-new-instance.yml: the branch the file is pushed to, with the credential to push.
      - name: checkout
        env:
          GIT_BRANCH: ${{ inputs.GIT_BRANCH }}
          REPO_URL: https://${{ github.repository_owner }}:${{ secrets.GH_PASSWORD }}@github.com/atex-products/mytype.git
        run: |
          git clone --branch "$GIT_BRANCH" "$REPO_URL" .

      # Same Node policy as route.yml: .nvmrc, floored at the oldest LTS we build on.
      - name: Resolve Node version
        id: node-version
        run: |
          MIN_NODE=22
          want=$(tr -dc '0-9.' < .nvmrc 2>/dev/null || true)
          major=${want%%.*}
          case "$major" in
            ''|*[!0-9]*) resolved=$MIN_NODE ;;
            *) if [ "$major" -lt "$MIN_NODE" ]; then resolved=$MIN_NODE; else resolved=$want; fi ;;
          esac
          echo "version=$resolved" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore cached pnpm dependencies
        uses: actions/cache/restore@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      # As contributor.yml: the latest release, the staged build context of the deploy needs 3.25+.
      - name: Convox CLI
        run: |
          curl -fsSL --retry 5 --retry-delay 5 -o convox https://github.com/convox/convox/releases/latest/download/convox-linux
          sudo install -m 755 convox /usr/local/bin/convox
          rm convox
          convox version

      # The inputs reach the script through the environment, never through the shell line: the script checks
      # that PRODUCT and ENVIRONMENT make apps/<product>/deploy/<environment>.env. No key and no value is here:
      # SECRET_VARIABLES is `set:` and the names of the variables the first job set.
      - name: Install
        env:
          GIT_BRANCH: ${{ inputs.GIT_BRANCH }}
          PRODUCT: ${{ inputs.PRODUCT }}
          ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
          ENV_FILE_CONTENT: ${{ inputs.ENV_FILE_CONTENT }}
          CONVOX_TOKEN: ${{ secrets.CONVOX_TOKEN }}
          SECRET_VARIABLES: ${{ needs.secrets.outputs.variables }}
        run: node shared/build/scripts/products/install.mjs "apps/$PRODUCT/deploy/$ENVIRONMENT.env"
